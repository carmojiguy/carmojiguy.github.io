<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Google</title>
<script>
(function(){
  var h = String(location.hash||"").replace(/^#/,"");
  var q = String(location.search||"").replace(/^\?/,"");
  var p = new URLSearchParams(h || q);
  var token = p.get("access_token") || "";
  var code = p.get("code") || "";
  var err = p.get("error") || "";
  function go(fail){
    var pending=false;
    try{ pending=sessionStorage.getItem("inspect.pendingSend")==="1"; }catch(e){}
    location.replace("./" + (fail ? "?auth=fail" : (pending ? "?resume=send" : "")));
  }
  try{
    if(token) sessionStorage.setItem("inspect.gtoken", token);
    if(err) sessionStorage.setItem("inspect.gerr", err);
  }catch(e){}
  if(code){
    fetch("https://gnm-guest-mailer-shawn-6802.vercel.app/api/upload", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({kind:"oauth", code:code, redirect_uri: location.origin.replace(/\/$/,"")+"/oauth.html"})
    }).then(function(r){ return r.json(); }).then(function(j){
      try{
        if(j && j.access_token) sessionStorage.setItem("inspect.gtoken", j.access_token);
        if(j && j.refresh_token) sessionStorage.setItem("inspect.grefr", j.refresh_token);
        if(j && j.email) sessionStorage.setItem("inspect.gemail", j.email);
      }catch(e){}
      go(!(j && j.access_token));
    }).catch(function(){ go(true); });
    return;
  }
  go(!!err);
})();
</script>
</head>
<body style="margin:0;background:#110E1A;color:#fff;font-family:system-ui;display:grid;place-items:center;min-height:100dvh">
<p>Connecting Google…</p>
</body>
</html>
